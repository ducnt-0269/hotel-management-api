name: Quality gate

on:
  push:
    branches: [master, main]
  pull_request:

# A newer push to the same branch cancels the run still in flight.
concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Lint · Format · Build · Test
    runs-on: ubuntu-latest

    # Postgres and Redis back the TypeORM and BullMQ work that lands next;
    # the e2e suite talks to both.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hotel
          POSTGRES_PASSWORD: hotel
          POSTGRES_DB: hotel_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U hotel -d hotel_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      # Catches the activation mail the auth e2e asserts on.
      mailpit:
        image: axllent/mailpit:latest
        ports: ['1025:1025', '8025:8025']
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      # Answers the Stripe calls the payment e2e makes; .env.test points the
      # client here.
      stripe-mock:
        image: stripe/stripe-mock:v0.203.0
        ports: ['12111:12111']
        options: >-
          --health-cmd "nc -z localhost 12111"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: hotel
      DB_PASSWORD: hotel
      DB_NAME: hotel_test
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      MAIL_HOST: localhost
      MAIL_PORT: 1025
      JWT_SECRET: ci-only-secret
      JWT_EXPIRES_IN: 1d

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: End-to-end tests
        run: npm run test:e2e
