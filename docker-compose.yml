# Local development stack.
services:
  postgres:
    image: postgres:17-alpine
    container_name: hotel-postgres
    environment:
      POSTGRES_USER: hotel
      POSTGRES_PASSWORD: hotel
      POSTGRES_DB: hotel
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hotel -d hotel']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: hotel-redis
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # Catches every outgoing mail; read them at http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: hotel-mailpit
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 10

  # Stateless stand-in for the Stripe API that e2e talks to; it validates
  # requests and answers with fixtures, but hosts no checkout page and sends
  # no webhooks. Dev talks to a real Stripe sandbox instead.
  stripe-mock:
    image: stripe/stripe-mock:v0.203.0
    container_name: hotel-stripe-mock
    ports:
      - '127.0.0.1:12111:12111'
    healthcheck:
      test: ['CMD', 'nc', '-z', 'localhost', '12111']
      interval: 5s
      timeout: 3s
      retries: 10

  # Forwards the sandbox's Checkout events to the app running on the host, so
  # a payment made in dev reaches the webhook. Opt-in:
  #   docker compose --profile stripe up -d stripe-cli
  # Its signing secret (for STRIPE_WEBHOOK_SECRET) is in
  #   docker compose logs stripe-cli
  stripe-cli:
    image: stripe/stripe-cli:latest
    container_name: hotel-stripe-cli
    profiles: [stripe]
    environment:
      STRIPE_API_KEY: ${STRIPE_SECRET_KEY:-}
    command: >-
      listen
      --events checkout.session.completed,checkout.session.expired
      --forward-to host.docker.internal:3000/api/payment-sessions/stripe-webhook
    extra_hosts:
      - 'host.docker.internal:host-gateway'

volumes:
  pgdata:
